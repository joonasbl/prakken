name: Build, Release & Deploy

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      release_id: ${{ steps.create_release.outputs.id }}
    steps:
      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2.5.0
        with:
          generate_release_notes: true
          draft: false

  build-frontend:
    runs-on: ubuntu-latest
    needs: create-release
    outputs:
      artifact_name: ${{ steps.save-artifact.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run tests
        working-directory: ./frontend
        run: npm run test:unit -- --run

      - name: Run type check
        working-directory: ./frontend
        run: npm run type-check

      - name: Run lint
        working-directory: ./frontend
        run: npm run lint

      - name: Build
        working-directory: ./frontend
        run: npm run build

      - name: Build Docker image
        working-directory: ./frontend
        run: docker build -t prakken-frontend:${{ github.ref_name }} -f Dockerfile.prod .

      - name: Save image to tar
        id: save-artifact
        run: |
          docker save -o prakken-frontend-${{ github.ref_name }}.tar prakken-frontend:${{ github.ref_name }}
          echo "artifact_name=prakken-frontend-${{ github.ref_name }}.tar" >> $GITHUB_OUTPUT

      - name: Upload to Release
        uses: softprops/action-gh-release@v2.5.0
        with:
          files: prakken-frontend-${{ github.ref_name }}.tar
          tag_name: ${{ github.ref_name }}

      - name: Upload artifact for deploy job
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: prakken-frontend-${{ github.ref_name }}.tar
          retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    needs: [create-release, build-frontend]
    if: always() && needs.build-frontend.result == 'success'

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}

      - name: Copy image to VPS
        run: |
          scp -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no prakken-frontend-${{ github.ref_name }}.tar ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            
            echo "=========================================="
            echo "  Deploying Prakken Frontend"
            echo "=========================================="
            echo ""
            
            # Stop and remove old container
            echo "[1/6] Stopping old container..."
            podman stop prakken-frontend 2>/dev/null || true
            podman rm prakken-frontend 2>/dev/null || true
            
            # Remove old image
            echo "[2/6] Removing old image..."
            podman rmi prakken-frontend:latest 2>/dev/null || true
            
            # Load new image
            echo "[3/6] Loading new image..."
            podman load -i /tmp/prakken-frontend-${{ github.ref_name }}.tar
            
            # Run container (HTTP only on port 3000, Caddy handles SSL)
            echo "[4/6] Starting new container..."
            podman run -d --name prakken-frontend \
              --restart=always \
              -p 3000:80 \
              prakken-frontend:${{ github.ref_name }}
            
            # Wait for container to start
            echo "[5/6] Waiting for container to start..."
            sleep 2
            
            # Check status
            echo "[6/6] Checking container status..."
            podman ps --filter name=prakken-frontend
            
            echo ""
            echo "=========================================="
            echo "  Container Logs (last 20 lines)"
            echo "=========================================="
            podman logs --tail 20 prakken-frontend
            
            echo ""
            echo "=========================================="
            echo "  Testing Local Connection"
            echo "=========================================="
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:3000 | grep -q "200"; then
              echo "✓ Container is responding on port 3000"
            else
              echo "⚠ Container may not be ready yet. Check logs above."
            fi
            
            echo ""
            echo "=========================================="
            echo "  Cleanup"
            echo "=========================================="
            rm -f /tmp/prakken-frontend-${{ github.ref_name }}.tar
            echo "✓ Cleaned up tar file"
            
            echo ""
            echo "=========================================="
            echo "  Deployment Complete!"
            echo "=========================================="
            echo ""
            echo "Site: https://prakken.dedyn.io"
            echo ""

      - name: Cleanup local artifacts
        run: rm -f prakken-frontend-${{ github.ref_name }}.tar

      - name: Verify deployment
        run: |
          echo "Waiting 5 seconds for deployment to propagate..."
          sleep 5
          
          echo "Testing HTTPS endpoint..."
          if curl -s -o /dev/null -w "%{http_code}" https://prakken.dedyn.io | grep -q "200"; then
            echo "✓ Deployment successful! Site is live."
          else
            echo "⚠ Site may not be ready yet. Check Caddy logs."
          fi
